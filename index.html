<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mexicano Padel — турниры</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#16212e;
    --panel-2:#1d2b3a;
    --line:#2a3a4d;
    --txt:#e8eef5;
    --muted:#8ea2b6;
    --accent:#16c79a;       /* padel green */
    --accent-2:#0e9e7c;
    --blue:#3aa0ff;
    --warn:#ffb14e;
    --gold:#ffd66b;
    --danger:#ff6b6b;
    --win:#16c79a;
    --radius:16px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    font-size:16px;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #1b3040 0%, var(--bg) 55%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 60px}

  /* Header */
  .top{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 18px;margin-bottom:18px;
    background:linear-gradient(120deg,var(--accent-2),#0c6f8a);
    border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .top .logo{font-size:1.5rem;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .top .logo .ball{font-size:1.4rem}
  .top .sub{color:rgba(255,255,255,.85);font-size:.9rem;font-weight:600}
  .top .spacer{flex:1}
  .top button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .top button:hover{background:rgba(255,255,255,.28)}

  h2{font-size:1.05rem;margin:0 0 12px;letter-spacing:.2px}
  h3{font-size:.95rem;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .grid-setup{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:780px){.grid-setup{grid-template-columns:1fr 1fr}}
  .span2{grid-column:1/-1}

  /* Buttons & inputs */
  button{
    font:inherit;cursor:pointer;border:none;border-radius:12px;padding:11px 16px;font-weight:700;
    background:var(--panel-2);color:var(--txt);border:1px solid var(--line);transition:.15s;
  }
  button:hover{border-color:var(--accent)}
  button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#04221a;border:none}
  button.primary:hover{filter:brightness(1.06)}
  button.ghost{background:transparent}
  button.danger{background:transparent;border-color:#5a2a2a;color:var(--danger)}
  button.danger:hover{border-color:var(--danger)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  button.sm{padding:7px 11px;font-size:.85rem;border-radius:10px}

  input[type=text],input[type=number]{
    font:inherit;background:#0c141d;color:var(--txt);border:1px solid var(--line);
    border-radius:12px;padding:11px 13px;width:100%;outline:none;transition:.15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,199,154,.16)}
  label.field{display:block;margin-bottom:14px}
  label.field>span{display:block;color:var(--muted);font-size:.85rem;margin-bottom:6px;font-weight:600}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:#0c141d;
    cursor:pointer;font-weight:700;color:var(--muted);transition:.15s;user-select:none;
  }
  .chip.active{background:rgba(22,199,154,.16);border-color:var(--accent);color:var(--accent)}
  .chip:hover{border-color:var(--accent)}

  .mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fmt-cards{display:grid;grid-template-columns:1fr;gap:10px}
  .mode-card{
    padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#0c141d;cursor:pointer;transition:.15s;
  }
  .mode-card .t{font-weight:800;margin-bottom:4px}
  .mode-card .d{font-size:.82rem;color:var(--muted);line-height:1.4}
  .mode-card.active{border-color:var(--accent);background:rgba(22,199,154,.10)}

  .stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stepper button{border:none;border-radius:0;background:var(--panel-2);width:46px;font-size:1.2rem;padding:9px 0}
  .stepper .val{min-width:54px;text-align:center;font-weight:800;font-size:1.1rem}

  /* Lists */
  .pill-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:340px;overflow:auto}
  .pill{
    display:flex;align-items:center;gap:10px;background:#0c141d;border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;
  }
  .pill .name{flex:1;font-weight:600}
  .pill .num{width:26px;height:26px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:800;flex:none}
  .pill .x{color:var(--muted);background:transparent;border:none;font-size:1.1rem;padding:2px 6px}
  .pill .x:hover{color:var(--danger)}
  .muted{color:var(--muted)}
  .hint{font-size:.82rem;color:var(--muted);line-height:1.5}
  .warnbox{background:rgba(255,177,78,.12);border:1px solid rgba(255,177,78,.4);color:var(--warn);padding:10px 12px;border-radius:12px;font-size:.85rem;margin-top:10px}

  .team-pill{display:flex;align-items:center;gap:10px;background:#0c141d;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .team-pill .vs{color:var(--muted);font-weight:800;font-size:.8rem}
  .team-pill .p{font-weight:700}

  /* fast team / player entry */
  .team-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .team-add input{flex:1;min-width:84px}
  .amp{color:var(--muted);font-weight:800;flex:none}
  .team-row{display:flex;align-items:center;gap:8px;background:#0c141d;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .team-row input{flex:1;min-width:54px;background:#0a1119;border:1px solid transparent;font-weight:700;padding:7px 9px}
  .team-row input:hover{border-color:var(--line)}
  .team-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,199,154,.14)}
  .nameedit{background:transparent;border:1px solid transparent;font-weight:600;flex:1;padding:7px 9px}
  .nameedit:hover{border-color:var(--line)}
  .nameedit:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,199,154,.14)}
  .linkbtn{background:transparent;border:none;color:var(--accent);padding:8px 0;font-size:.85rem;cursor:pointer;font-weight:700}
  .linkbtn:hover{text-decoration:underline;border:none}
  .bulkbox{margin-top:8px}
  .bulkbox textarea{width:100%;background:#0c141d;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical;line-height:1.5}
  .bulkbox textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,199,154,.14)}

  /* Play layout */
  .play-grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:900px){.play-grid{grid-template-columns:1fr 360px;align-items:start}}
  .round-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .round-head .badge{background:var(--accent);color:#04221a;font-weight:800;border-radius:999px;padding:5px 14px}
  .round-head .spacer{flex:1}

  .courts{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:560px){.courts{grid-template-columns:1fr 1fr}}
  @media(min-width:900px){.courts{grid-template-columns:1fr}}
  @media(min-width:1100px){.courts{grid-template-columns:1fr 1fr}}

  .match{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .match .court{font-size:.78rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;justify-content:space-between}
  .match .court .target{color:var(--accent)}
  .side{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent}
  .side .names{flex:1;font-weight:700;line-height:1.25}
  .side .sub{font-size:.75rem;color:var(--muted);font-weight:600}
  .side.win{background:rgba(22,199,154,.12);border-color:rgba(22,199,154,.45)}
  .side.win .names{color:var(--accent)}
  .side .crown{font-size:.95rem;margin-left:6px}
  .vs-line{text-align:center;color:var(--muted);font-size:.72rem;font-weight:800;margin:4px 0;letter-spacing:.1em}
  .byes{margin-top:10px;font-size:.82rem;color:var(--muted)}
  .byes b{color:var(--txt)}

  /* score stepper */
  .score-ctrl{display:flex;align-items:center;gap:6px;flex:none}
  .score-ctrl .stp{width:42px;height:48px;font-size:1.4rem;line-height:1;padding:0;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;color:var(--txt)}
  .score-ctrl .stp:hover{border-color:var(--accent);color:var(--accent)}
  .score-ctrl .stp:active{background:var(--accent);color:#04221a}
  .score-ctrl input{width:62px;text-align:center;font-size:1.5rem;font-weight:800;padding:9px 2px}
  /* hide native number spinners */
  .score-ctrl input::-webkit-outer-spin-button,.score-ctrl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .score-ctrl input{-moz-appearance:textfield}
  .match-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;min-height:22px}
  /* теннисный ввод */
  .tn-head{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
  .tn-head .tn-name{flex:1;font-weight:700;line-height:1.25}
  .tn-head .tn-name.right{text-align:right}
  .tn-head .tn-name.win{color:var(--accent)}
  .tn-head .vs-mini{font-size:.72rem;font-weight:800;letter-spacing:.1em}
  .tennis-entry{display:flex;flex-direction:column;gap:8px}
  .tset{display:flex;align-items:center;justify-content:center;gap:8px}
  .tset .tlabel{font-size:.75rem;color:var(--muted);font-weight:700;min-width:52px}
  .tset input{width:52px;text-align:center;font-size:1.35rem;font-weight:800;padding:8px 2px}
  .tset input::-webkit-outer-spin-button,.tset input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .tset input{-moz-appearance:textfield}
  .past-match.tn-past{flex-direction:column;align-items:stretch;gap:6px}
  .past-match.tn-past .pa{text-align:left}.past-match.tn-past .pb{text-align:left}
  .mstatus{font-size:.82rem;color:var(--accent);font-weight:700}
  .mstatus.tie{color:var(--warn)}
  .clr{background:transparent;border:none;color:var(--muted);font-size:.78rem;padding:2px 6px;cursor:pointer}
  .clr:hover{color:var(--danger)}

  /* finish / podium */
  .finish h2{margin-top:6px}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:14px 0 6px;flex-wrap:wrap}
  .pod{background:#0c141d;border:1px solid var(--line);border-radius:16px;padding:16px 20px;text-align:center;min-width:130px}
  .pod .medal{font-size:2.2rem;line-height:1}
  .pod .pname{font-weight:800;margin-top:8px;font-size:1.05rem}
  .pod .ppts{color:var(--accent);font-weight:700;font-size:.88rem;margin-top:3px}
  .pod0{order:2;transform:translateY(-12px);border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,214,107,.45),0 12px 26px rgba(0,0,0,.35)}
  .pod1{order:1}
  .pod2{order:3}
  @media(max-width:520px){.pod0{transform:none}.podium{gap:10px}.pod{min-width:46%;padding:12px}}

  /* knockout bracket */
  .champ-name{font-size:1.7rem;font-weight:800;color:var(--gold);margin-top:2px}
  .bracket-scroll{overflow-x:auto;padding-bottom:8px}
  .bracket{display:flex;gap:16px;min-width:min-content;align-items:stretch}
  .bcol{display:flex;flex-direction:column;min-width:172px}
  .bcol-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:8px;text-align:center}
  .bcol-body{display:flex;flex-direction:column;justify-content:space-around;gap:12px;flex:1}
  .bmatch{background:#0c141d;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .bmatch.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,199,154,.2)}
  .bmatch.bye{opacity:.85}
  .bmatch.champ{border-color:var(--gold);background:rgba(255,214,107,.08)}
  .bteam{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-size:.9rem;font-weight:600}
  .bteam+.bteam{border-top:1px solid var(--line)}
  .bteam.bw{color:var(--accent);font-weight:800}
  .bteam.empty{color:var(--muted)}
  .bteam .bn i{color:var(--muted);font-weight:600;font-size:.82rem}
  .bteam .bs{font-weight:800;min-width:18px;text-align:right;color:var(--txt)}

  details.past{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
  details.past summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--muted)}
  details.past[open] summary{color:var(--txt)}
  .past-match{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
  .past-match .s{font-weight:800}
  .past-match .w{color:var(--accent);font-weight:700}
  .past-match .pa{flex:1;text-align:left}
  .past-match .pb{flex:1;text-align:right}
  .past-match .pedit{display:flex;align-items:center;gap:5px;flex:none}
  .past-match .pedit input{width:46px;text-align:center;font-weight:800;font-size:.95rem;padding:5px 3px;border-radius:9px}
  .past-match .pedit input::-webkit-outer-spin-button,.past-match .pedit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .past-match .pedit input{-moz-appearance:textfield}

  /* Standings */
  .stand{position:sticky;top:14px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:9px 8px;text-align:center}
  th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
  td{border-bottom:1px solid var(--line)}
  td.name{text-align:left;font-weight:700}
  tr.lead td{background:rgba(255,214,107,.07)}
  .rank{width:24px;height:24px;border-radius:7px;background:var(--panel-2);display:inline-grid;place-items:center;font-weight:800;font-size:.78rem}
  tr:nth-child(1) .rank{background:var(--gold);color:#3a2c00}
  tr:nth-child(2) .rank{background:#cbd5e1;color:#1f2937}
  tr:nth-child(3) .rank{background:#e0a06a;color:#3a1f00}
  .pf{font-weight:800;color:var(--accent)}

  .empty{padding:30px;text-align:center;color:var(--muted)}
  .footer-note{margin-top:26px;text-align:center;color:var(--muted);font-size:.78rem;line-height:1.6}
  .sticky-actions{position:sticky;bottom:0;padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><span class="ball">🎾</span> Mexicano Padel</div>
    <div class="sub" id="topSub"></div>
    <div class="spacer"></div>
    <button id="newBtn" class="sm" style="display:none" onclick="newTournament()">↻ Новый турнир</button>
  </div>

  <div id="saveErr" style="display:none;background:rgba(255,107,107,.15);border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:600">
    ⚠ Не удалось сохранить — в браузере кончилось место. Скопируйте итоги (кнопка «Поделиться») и не закрывайте вкладку.
  </div>

  <div id="app"></div>

  <div class="footer-note">
    Данные сохраняются на этом устройстве. Можно закрывать вкладку — турнир не потеряется (но при очистке данных браузера сотрётся).
  </div>
</div>

<script>
"use strict";
const LS_KEY = "mexicano_padel_v1";

function defaultState(){
  return {stage:"setup", mode:"rotating", schedule:"mexicano", legs:1, koSeed:"order", target:24, courts:2, scoring:"fixed", maxRounds:0,
          tennisSets:1,
          groupCount:2, advancePerGroup:2, phase:"groups", groupTeams:[], groupRoundCount:0,
          players:[], teams:[], rounds:[], cur:0, kingQueue:[], _pid:1, _tid:1, _mid:1};
}
let state = loadState() || defaultState();
let bulkOpen = false; // открыт ли блок «вставить списком» (только UI)

function loadState(){
  try{
    const p=JSON.parse(localStorage.getItem(LS_KEY));
    if(!p)return null;
    const hadCur=(typeof p.cur==="number");          // было ли поле в самом сейве (а не в дефолтах)
    const s=Object.assign(defaultState(), p);        // миграция: дополняем новыми полями (scoring, schedule, cur…)
    const lastIdx=Math.max(0,(s.rounds||[]).length-1);
    if(!hadCur) s.cur=lastIdx;                        // старый сейв без cur — встаём на последний раунд
    s.cur=Math.min(Math.max(0,s.cur||0),lastIdx);    // защита от выхода за диапазон
    return s;
  }catch(e){return null;}
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); saveBanner(false); }
  catch(e){ saveBanner(true); }            // переполнение/блокировка хранилища — не молчим
}
function saveBanner(show){
  const b=document.getElementById("saveErr");
  if(b) b.style.display=show?"block":"none";
}
const BK_KEY = "mexicano_padel_backup";    // резервная копия для undo-на-сброс
function backupCurrent(){
  try{ if(state.rounds && state.rounds.length) localStorage.setItem(BK_KEY, JSON.stringify(state)); }catch(e){}
}
function hasBackup(){ try{ return !!localStorage.getItem(BK_KEY); }catch(e){ return false; } }
function restoreBackup(){
  try{
    const b=localStorage.getItem(BK_KEY); if(!b)return;
    localStorage.setItem(LS_KEY, b);       // вернуть прошлый турнир как текущий
    localStorage.removeItem(BK_KEY);
    state=loadState()||defaultState(); bulkOpen=false; save(); render();
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){}
}
function uid(k){ return state["_"+k]++; }
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- units / helpers ---------- */
function isTeams(){return state.mode==="teams";}
function isRR(){return state.schedule==="roundrobin";}
function isKO(){return state.schedule==="knockout";}
function isKing(){return state.schedule==="king";}
function isGroups(){return state.schedule==="groups";}
function isAmericano(){return state.schedule==="americano";}
function isTennis(){return state.scoring==="tennis";}
function tennisNeed(){return Math.floor((state.tennisSets||1)/2)+1;} // сетов для победы: 1 (один сет) или 2 (из 3)
function groupLetter(gi){return String.fromCharCode(1040+gi);} // А, Б, В, Г…
function getUnits(){return isTeams()? state.teams.map(t=>({id:t.id})) : state.players.map(p=>({id:p.id}));}
function playerName(id){const p=state.players.find(p=>p.id===id);return p?p.name:"?";}
function teamLabel(t){return playerName(t.p1)+" / "+playerName(t.p2);}
function unitName(id){
  if(isTeams()){const t=state.teams.find(t=>t.id===id);return t?teamLabel(t):"?";}
  return playerName(id);
}
function pairedIds(){const s=new Set();state.teams.forEach(t=>{s.add(t.p1);s.add(t.p2);});return s;}
function findMatch(mid){for(const r of state.rounds)for(const m of r.matches)if(m.id===mid)return m;return null;}
function sideNamesInline(ids){return ids.map(id=>esc(unitName(id))).join(" + ");}
function pluralRound(n){const a=Math.abs(n)%100,b=n%10;if(a>10&&a<20)return"раундов";if(b>1&&b<5)return"раунда";if(b===1)return"раунд";return"раундов";}
function pluralMatch(n){const a=Math.abs(n)%100,b=n%10;if(a>10&&a<20)return"матчей";if(b>1&&b<5)return"матча";if(b===1)return"матч";return"матчей";}
function pluralGame(n){const a=Math.abs(n)%100,b=n%10;if(a>10&&a<20)return"геймов";if(b>1&&b<5)return"гейма";if(b===1)return"гейм";return"геймов";}
/* подпись режима счёта: в теннисе «до N очков» не имеет смысла */
function scoreLabel(){return isTennis()?("теннис · "+((state.tennisSets||1)>1?"2 из 3 сетов":"1 сет")):("до "+state.target);}
function ptsStr(n){return isTennis()?(n+" "+pluralGame(n)):(n+" очк.");}

/* ---------- stats / standings ---------- */
function computeStats(){
  const stats={};
  getUnits().forEach(u=>stats[u.id]={id:u.id,pf:0,pa:0,wins:0,losses:0,played:0,byes:0});
  state.rounds.forEach(r=>{
    r.matches.forEach(m=>{
      if(!m.done)return;
      // победа — по sa/sb (в теннисе это выигранные сеты); очки в зачёт — геймы (теннис) или очки
      const add=(ids,sf,sa,pfv,pav)=>ids.forEach(id=>{const s=stats[id];if(!s)return;s.pf+=pfv;s.pa+=pav;s.played++;if(sf>sa)s.wins++;else if(sf<sa)s.losses++;});
      const pA=isTennis()?(m.ga||0):m.sa, pB=isTennis()?(m.gb||0):m.sb;
      add(m.a,m.sa,m.sb,pA,pB); add(m.b,m.sb,m.sa,pB,pA);
    });
    (r.byes||[]).forEach(id=>{if(stats[id])stats[id].byes++;});
  });
  return stats;
}
function standings(){
  const arr=Object.values(computeStats());
  if(isRR())  // круговая: сперва победы, затем разница очков, затем набранные
    return arr.sort((x,y)=>
      y.wins-x.wins || (y.pf-y.pa)-(x.pf-x.pa) || y.pf-x.pf || unitName(x.id).localeCompare(unitName(y.id),"ru"));
  return arr.sort((x,y)=>   // Mexicano: сперва набранные очки, затем разница
    y.pf-x.pf || (y.pf-y.pa)-(x.pf-x.pa) || y.wins-x.wins || unitName(x.id).localeCompare(unitName(y.id),"ru"));
}

/* ---------- round generation ---------- */
function generateRound(){
  const groupSize = isTeams()?2:4;
  const stats=computeStats();
  let order = state.rounds.length===0 ? shuffle(getUnits().map(u=>u.id)) : standings().map(s=>s.id);
  const total=order.length;
  const capacity=Math.min(state.courts*groupSize, Math.floor(total/groupSize)*groupSize);
  let byes=[];
  if(capacity<total){
    const sitN=total-capacity;
    const cand=order.map((id,idx)=>({id,byes:stats[id]?stats[id].byes:0,idx}));
    // меньше всего отдыхали — садятся; при равенстве отдыхает тот, кто ниже в таблице
    cand.sort((a,b)=> a.byes-b.byes || b.idx-a.idx);
    byes=cand.slice(0,sitN).map(c=>c.id);
  }
  const playing=order.filter(id=>!byes.includes(id));
  const matches=[];
  let court=1;
  for(let i=0;i<playing.length;i+=groupSize){
    const g=playing.slice(i,i+groupSize);
    let a,b;
    if(groupSize===2){a=[g[0]];b=[g[1]];}
    else{a=[g[0],g[3]];b=[g[1],g[2]];}   // 1+4 vs 2+3
    matches.push({id:uid("mid"),court,a,b,sa:null,sb:null,done:false});
    court++;
  }
  state.rounds.push({n:state.rounds.length+1,matches,byes});
  state.cur=state.rounds.length-1;
  save();
}

/* Круговой метод: список «туров», каждый — массив пар [a,b], команды в туре не повторяются. */
function circleRounds(ids){
  const arr=ids.slice();
  if(arr.length%2!==0) arr.push(null);              // нечётное — фиктивная команда (пропуск)
  const n=arr.length, half=n/2, rounds=[];
  let ring=arr.slice();
  for(let r=0;r<Math.max(1,n-1);r++){
    const pairs=[];
    for(let i=0;i<half;i++){ const a=ring[i], b=ring[n-1-i]; if(a!=null&&b!=null) pairs.push([a,b]); }
    rounds.push(pairs);
    ring=[ring[0], ring[n-1], ...ring.slice(1,n-1)]; // фиксируем первый, остальных вращаем
  }
  return rounds;
}
/* Полное круговое расписание (round robin): делим туры на раунды по числу кортов. */
function generateFullSchedule(){
  const cr=circleRounds(shuffle(state.teams.map(t=>t.id)));
  const legRounds=[];
  for(let leg=0;leg<Math.max(1,state.legs||1);leg++){
    cr.forEach(pairs=>legRounds.push(pairs.map(p=>leg%2?[p[1],p[0]]:[p[0],p[1]])));
  }
  state.rounds=[];
  const C=Math.max(1,state.courts);
  legRounds.forEach(pairs=>{
    for(let i=0;i<pairs.length;i+=C){
      const chunk=pairs.slice(i,i+C);
      const matches=chunk.map((p,idx)=>({id:uid("mid"),court:idx+1,a:[p[0]],b:[p[1]],sa:null,sb:null,done:false}));
      state.rounds.push({n:state.rounds.length+1,matches,byes:[],rr:true});
    }
  });
  state.cur=0;
  save();
}

/* Americano: круговой метод даёт партнёрства (каждый с каждым ровно раз), внутри тура пары играют друг против друга. */
function generateAmericano(){
  const cr=circleRounds(state.players.map(p=>p.id));   // N-1 туров партнёрств (1-факторизация)
  state.rounds=[];
  cr.forEach(pairs=>{
    const matches=[];
    for(let i=0;i+1<pairs.length;i+=2)
      matches.push({id:uid("mid"),court:matches.length+1,a:pairs[i],b:pairs[i+1],sa:null,sb:null,done:false});
    const bye=(pairs.length%2===1)?pairs[pairs.length-1]:[];  // нечётная пара отдыхает весь тур
    state.rounds.push({n:state.rounds.length+1,matches,byes:bye,amer:true});
  });
  state.cur=0;
  save();
}

/* ---------- knockout (сетка на вылет, single elimination) ---------- */
function nextPow2(n){let s=1;while(s<n)s*=2;return s;}
function seedOrder(S){               // позиции посева 1..S в порядке сетки (1,2 → 1,4,2,3 → …)
  let seeds=[1,2];
  while(seeds.length<S){ const t=seeds.length*2+1, nx=[]; for(const s of seeds){nx.push(s);nx.push(t-s);} seeds=nx; }
  return seeds;
}
function koRoundName(matchCount){
  const m={1:"Финал",2:"Полуфинал",4:"Четвертьфинал",8:"1/8 финала",16:"1/16 финала",32:"1/32 финала"};
  return m[matchCount] || ("1/"+matchCount+" финала");
}
function koWinnerId(m){
  if(!m) return null;
  if(m.bye) return (m.a&&m.a.length)?m.a[0]:((m.b&&m.b.length)?m.b[0]:null);
  if(!m.done || m.sa===m.sb) return null;
  return m.sa>m.sb ? m.a[0] : m.b[0];
}
function koLoserId(m){
  if(!m||m.bye||!m.done||m.sa===m.sb) return null;
  return m.sa>m.sb ? (m.b&&m.b[0]) : (m.a&&m.a[0]);
}
function koRoundDecided(r){
  if(!r||!r.matches.length) return false;
  return r.matches.every(m=> m.bye ? true : (m.done && m.sa!=null && m.sb!=null && m.sa!==m.sb));
}
function advanceKO(rd,matchIdx,teamId){
  const next=state.rounds[rd+1]; if(!next) return;
  const nm=next.matches[Math.floor(matchIdx/2)];
  if(matchIdx%2===0) nm.a=[teamId]; else nm.b=[teamId];
}
function koAdvanceCurrent(){           // продвинуть победителей текущего раунда в следующий
  const rd=state.cur, r=state.rounds[rd];
  r.matches.forEach((m,i)=>{ const w=koWinnerId(m); if(w!=null) advanceKO(rd,i,w); });
}
function buildBracketRounds(ids){   // массив KO-раундов из упорядоченного списка id (с посевом и проходами)
  const N=ids.length, S=nextPow2(N), order=seedOrder(S);
  const slot = order.map(pos=> pos<=N ? ids[pos-1] : null);   // null = пропуск (bye)
  const numRounds=Math.round(Math.log2(S)), rounds=[];
  let size=S;
  for(let rd=0; rd<numRounds; rd++){
    const matches=[];
    for(let i=0;i<size/2;i++) matches.push({id:uid("mid"),court:i+1,a:[],b:[],sa:null,sb:null,done:false,bye:false});
    rounds.push({n:rd+1,matches,ko:true});
    size/=2;
  }
  const r0=rounds[0].matches;                                  // первый раунд из слотов
  for(let i=0;i<r0.length;i++){
    r0[i].a = slot[2*i]!=null ? [slot[2*i]] : [];
    r0[i].b = slot[2*i+1]!=null ? [slot[2*i+1]] : [];
    if((r0[i].a.length>0) !== (r0[i].b.length>0)){ r0[i].bye=true; r0[i].done=true; }  // одна сторона пуста → проход
  }
  return rounds;
}
function buildBracket(){
  const ids = state.koSeed==="random" ? shuffle(state.teams.map(t=>t.id)) : state.teams.map(t=>t.id);
  state.rounds=buildBracketRounds(ids);
  state.cur=0;
  save();
}
function koResults(){
  const last=state.rounds[state.rounds.length-1];
  const finalM=last && last.matches[0];
  const champion=finalM?koWinnerId(finalM):null;
  const runnerUp=finalM?koLoserId(finalM):null;
  const semis=[];
  const semiR=state.rounds[state.rounds.length-2];
  if(semiR && semiR.ko) semiR.matches.forEach(m=>{const l=koLoserId(m); if(l!=null)semis.push(l);}); // только настоящий полуфинал (не групповой раунд)
  return {champion,runnerUp,semifinalists:semis};
}

/* ---------- Группы + плей-офф ---------- */
function splitGroups(){
  const ids = state.koSeed==="random" ? shuffle(state.teams.map(t=>t.id)) : state.teams.map(t=>t.id);
  const G=Math.max(2,state.groupCount), groups=Array.from({length:G},()=>[]);
  ids.forEach((id,i)=>{ const row=Math.floor(i/G), col=i%G; groups[row%2===0?col:(G-1-col)].push(id); }); // «змейка» по посеву
  return groups.filter(g=>g.length>0);
}
function generateGroupStage(){
  const groups=splitGroups();
  state.groupTeams=groups;
  const groupCircles=groups.map(g=>circleRounds(g));            // туры внутри каждой группы
  const maxR=Math.max(...groupCircles.map(c=>c.length));
  const C=Math.max(1,state.courts);
  state.rounds=[];
  for(let k=0;k<maxR;k++){
    let pairs=[];
    const maxLen=Math.max(...groupCircles.map(c=>c[k]?c[k].length:0));
    for(let j=0;j<maxLen;j++)                                   // чередуем группы: матч A, матч Б, …
      groupCircles.forEach((circ,gi)=>{ if(circ[k]&&circ[k][j]) pairs.push({pair:circ[k][j],group:gi}); });
    for(let i=0;i<pairs.length;i+=C){
      const chunk=pairs.slice(i,i+C);
      const matches=chunk.map((x,idx)=>({id:uid("mid"),court:idx+1,a:[x.pair[0]],b:[x.pair[1]],sa:null,sb:null,done:false,group:x.group}));
      state.rounds.push({n:state.rounds.length+1,matches,byes:[],gr:true});
    }
  }
  state.groupRoundCount=state.rounds.length;
  state.phase="groups";
  state.cur=0;
  save();
}
function groupStandings(gi){
  const stats={};
  (state.groupTeams[gi]||[]).forEach(id=>stats[id]={id,pf:0,pa:0,wins:0,losses:0,played:0});
  state.rounds.forEach(r=>{ if(!r.gr) return; r.matches.forEach(m=>{
    if(m.group!==gi || !m.done) return;
    const add=(ids,sf,sa)=>ids.forEach(id=>{const s=stats[id];if(!s)return;s.pf+=sf;s.pa+=sa;s.played++;if(sf>sa)s.wins++;else if(sf<sa)s.losses++;});
    add(m.a,m.sa,m.sb); add(m.b,m.sb,m.sa);
  });});
  return Object.values(stats).sort((x,y)=> y.wins-x.wins || (y.pf-y.pa)-(x.pf-x.pa) || y.pf-x.pf || unitName(x.id).localeCompare(unitName(y.id),"ru"));
}
function teamGroup(id){ for(let gi=0;gi<state.groupTeams.length;gi++) if((state.groupTeams[gi]||[]).includes(id)) return gi; return -1; }
function avoidSameGroupR1(r0){          // развести одногруппников в 1-м раунде плей-офф (для не-степени-двойки, напр. 3 группы × топ-2)
  const same=(m)=>m.a.length&&m.b.length&&teamGroup(m.a[0])===teamGroup(m.b[0]);
  for(let i=0;i<r0.length;i++){
    if(!same(r0[i])) continue;
    for(let j=0;j<r0.length;j++){
      if(j===i||!r0[j].a.length||!r0[j].b.length) continue;
      const bi=r0[i].b[0], bj=r0[j].b[0];
      if(teamGroup(r0[i].a[0])!==teamGroup(bj) && teamGroup(r0[j].a[0])!==teamGroup(bi)){ r0[i].b=[bj]; r0[j].b=[bi]; break; }
    }
  }
}
function buildPlayoff(){
  const A=Math.max(1,state.advancePerGroup);
  const tops=state.groupTeams.map((g,gi)=>groupStandings(gi).slice(0,A).map(s=>s.id));
  // посев по рангам: сперва все победители групп, затем все вторые… seedOrder сам разведёт крест-накрест (А1–Б2, Б1–А2)
  let seeds=[];
  for(let rank=0;rank<A;rank++) tops.forEach(t=>{ if(t[rank]!=null) seeds.push(t[rank]); });
  const startIdx=state.rounds.length;
  const poRounds=buildBracketRounds(seeds);
  avoidSameGroupR1(poRounds[0].matches);                       // не сводить одногруппников сразу
  poRounds.forEach(r=>state.rounds.push(r));                   // дописываем сетку после групп
  state.phase="playoff";
  state.cur=startIdx;
  save();
}

/* ---------- King of the Court (Кинг): один корт, победители остаются, очередь ---------- */
function generateKingRound(){
  const ids=state.players.map(p=>p.id);
  state.rounds=[{n:1,king:true,kingSide:null,byes:[],
    matches:[{id:uid("mid"),court:1,a:[ids[0],ids[1]],b:[ids[2],ids[3]],sa:null,sb:null,done:false}]}];
  state.kingQueue=ids.slice(4);          // остальные — в очереди
  state.cur=0;
  save();
}
function kingDecided(r){ const m=r&&r.matches[0]; return !!(m&&m.done&&m.sa!=null&&m.sb!=null&&m.sa!==m.sb); }
function generateNextKing(){
  const m=curRound().matches[0];
  const winner=(m.sa>m.sb?m.a:m.b).slice();
  const loser =(m.sa>m.sb?m.b:m.a).slice();
  state.kingQueue.push(loser[0],loser[1]);            // проигравшие в конец очереди
  const c1=state.kingQueue.shift(), c2=state.kingQueue.shift();  // челленджеры — из начала
  state.rounds.push({n:curRound().n+1,king:true,kingSide:"a",byes:[],
    matches:[{id:uid("mid"),court:1,a:winner,b:[c1,c2],sa:null,sb:null,done:false}]});
  state.cur=state.rounds.length-1;
  save();
}

function curRound(){return state.rounds[state.cur];}
function roundComplete(r){return r&&r.matches.length>0&&r.matches.every(m=>m.done);}
function roundWaiting(r){
  if(!isRR()) return r.byes||[];
  const playing=new Set();
  r.matches.forEach(m=>{m.a.forEach(x=>playing.add(x));m.b.forEach(x=>playing.add(x));});
  return getUnits().map(u=>u.id).filter(id=>!playing.has(id));
}

/* ---------- actions ---------- */
function setFormat(mode,schedule){state.mode=mode;state.schedule=schedule;save();render();}
function setLegs(n){state.legs=n;save();render();}
function setKoSeed(s){state.koSeed=s;save();render();}
function setGroupCount(n){state.groupCount=n;save();render();}
function setAdvance(n){state.advancePerGroup=n;save();render();}
function setTarget(v){state.target=v;save();render();}
function setCourts(d){state.courts=Math.max(1,Math.min(12,state.courts+d));save();render();}
function setScoring(s){state.scoring=s;save();render();}
function setTennisSets(n){state.tennisSets=n;save();render();}
function setMaxRounds(n){state.maxRounds=n;save();render();}

function addPlayer(){
  const inp=document.getElementById("playerName");
  const name=(inp.value||"").trim();
  if(!name)return;
  state.players.push({id:uid("pid"),name});
  inp.value="";save();render();
  setTimeout(()=>{const i=document.getElementById("playerName");if(i)i.focus();},0);
}
function removePlayer(id){
  state.players=state.players.filter(p=>p.id!==id);
  state.teams=state.teams.filter(t=>t.p1!==id&&t.p2!==id);
  save();render();
}
function editPlayerName(id,val){const p=state.players.find(p=>p.id===id);if(p){p.name=val;save();}}

/* --- команды: прямой ввод пары, инлайн-правка, список --- */
function unpairedPlayers(){const paired=pairedIds();return state.players.filter(p=>!paired.has(p.id));}
function addTeamDirect(){
  const a=document.getElementById("tnA"), b=document.getElementById("tnB");
  if(!a||!b)return;
  const na=(a.value||"").trim(), nb=(b.value||"").trim();
  if(!na){a.focus();return;}
  if(!nb){b.focus();return;}
  const p1=uid("pid"), p2=uid("pid");
  state.players.push({id:p1,name:na},{id:p2,name:nb});
  state.teams.push({id:uid("tid"),p1:p1,p2:p2});
  save();render();
  setTimeout(()=>{const x=document.getElementById("tnA");if(x)x.focus();},0);  // фокус назад — для быстрого ввода
}
function editTeamName(teamId,slot,val){
  const t=state.teams.find(t=>t.id===teamId);if(!t)return;
  const p=state.players.find(p=>p.id===t[slot]);
  if(p){p.name=val;save();}                 // без render — фокус в поле сохраняется
}
function removeTeam(id){
  const t=state.teams.find(t=>t.id===id);
  if(t)state.players=state.players.filter(p=>p.id!==t.p1&&p.id!==t.p2);
  state.teams=state.teams.filter(t=>t.id!==id);
  save();render();
}
function autoPair(){
  const free=shuffle(unpairedPlayers().map(p=>p.id));
  for(let i=0;i+1<free.length;i+=2)state.teams.push({id:uid("tid"),p1:free[i],p2:free[i+1]});
  save();render();
}
function clearUnpaired(){
  const paired=pairedIds();
  state.players=state.players.filter(p=>paired.has(p.id));
  save();render();
}
function toggleBulk(){bulkOpen=!bulkOpen;render();}
function addBulkNames(){
  const ta=document.getElementById("bulkInput");if(!ta)return;
  const names=ta.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){bulkOpen=false;render();return;}
  let leftover="";
  if(isTeams()){
    for(let i=0;i+1<names.length;i+=2){
      const p1=uid("pid"),p2=uid("pid");
      state.players.push({id:p1,name:names[i]},{id:p2,name:names[i+1]});
      state.teams.push({id:uid("tid"),p1:p1,p2:p2});
    }
    if(names.length%2===1)leftover=names[names.length-1];  // нечётный остаток
  }else{
    names.forEach(n=>state.players.push({id:uid("pid"),name:n}));
  }
  bulkOpen=false;save();render();
  if(leftover){const a=document.getElementById("tnA");if(a){a.value=leftover;a.focus();}}
}

function startTournament(){
  if(isGroups()){
    if(state.teams.length<state.groupCount*2){alert("Нужно минимум "+(state.groupCount*2)+" команд (по 2 в каждую группу).");return;}
  }else if(isTeams()){
    if(state.teams.length<2){alert("Нужно минимум 2 команды.");return;}
  }else{
    if(state.players.length<4){alert("Нужно минимум 4 игрока.");return;}
  }
  state.stage="play";
  if(state.rounds.length===0){
    if(isKO()) buildBracket();
    else if(isGroups()) generateGroupStage();
    else if(isRR()) generateFullSchedule();
    else if(isAmericano()) generateAmericano();
    else if(isKing()) generateKingRound();
    else generateRound();
  }
  save();render();
}
function nextRound(){
  const r=curRound();
  if(isKO()){
    if(!koRoundDecided(r)) return;
    if(state.cur>=state.rounds.length-1){ finishTournament(); return; }   // финал сыгран → чемпион
    koAdvanceCurrent();
    state.cur++; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(isKing()){
    if(!kingDecided(r)) return;
    if(state.maxRounds && r.n>=state.maxRounds){ finishTournament(); return; }
    generateNextKing(); render(); window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(isGroups()){
    if(state.phase==="playoff"){
      if(!koRoundDecided(r)) return;
      if(state.cur>=state.rounds.length-1){ finishTournament(); return; }   // финал → чемпион
      koAdvanceCurrent(); state.cur++; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    if(!roundComplete(r)) return;                                            // фаза групп
    if(state.cur>=state.groupRoundCount-1){ buildPlayoff(); render(); window.scrollTo({top:0,behavior:"smooth"}); return; } // группы доиграны → в плей-офф
    state.cur++; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(!roundComplete(r))return;
  if(isRR()||isAmericano()){
    if(state.cur>=state.rounds.length-1){ finishTournament(); return; }
    state.cur++; save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  if(state.maxRounds && r.n>=state.maxRounds){ finishTournament(); return; }
  generateRound();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function finishTournament(){
  state.stage="finish";save();render();
  window.scrollTo({top:0,behavior:"smooth"});
}

}

function fallbackCopy(txt){

function clampScore(v){
  if(v==null||isNaN(v))return null;
  v=Math.round(v); if(v<0)v=0;
  if(state.scoring==="fixed"&&v>state.target)v=state.target;
  return v;
}

  else if(isGroups()){ const g=document.getElementById("groupTables"); if(g)renderGroupTables(); }
}

/* ---------- теннисный счёт (сеты/геймы): sa/sb = выигранные сеты, ga/gb = сумма геймов ---------- */
function ensureSets(m){ if(!m.sets)m.sets=[]; while(m.sets.length<(state.tennisSets||1))m.sets.push([null,null]); return m.sets; }
function recalcTennis(m){
  ensureSets(m);
  let setsA=0,setsB=0,gA=0,gB=0;
  m.sets.forEach(s=>{ const a=s[0],b=s[1];
    if(a!=null)gA+=a; if(b!=null)gB+=b;
    if(a!=null&&b!=null&&a!==b){ if(a>b)setsA++; else setsB++; }
  });
  m.sa=setsA; m.sb=setsB; m.ga=gA; m.gb=gB;
  const need=tennisNeed();
  // ничья по договорённости (например 5:5) — тоже сыгранный матч: геймы в зачёт, победы никому
  const allFilled=m.sets.length>0&&m.sets.every(s=>s[0]!=null&&s[1]!=null);
  m.done=(setsA>=need||setsB>=need||allFilled);
}
function setTennisGame(mid,setIdx,side,raw){
  const m=findMatch(mid); if(!m)return;
  ensureSets(m);
  const v=raw===""?null:Math.max(0,Math.min(99,parseInt(raw,10)||0));
  m.sets[setIdx][side==="a"?0:1]=v;
  recalcTennis(m); save();
  updateMatchVisual(mid); renderStandings(); updateNextBtn(); refreshLiveTables();
}
function clearTennis(mid){
  const m=findMatch(mid); if(!m)return;
  m.sets=[]; ensureSets(m); m.sa=m.sb=m.ga=m.gb=null; m.done=false; save();
  m.sets.forEach((s,i)=>["a","b"].forEach(sd=>{const el=document.getElementById("tn-"+mid+"-"+i+"-"+(sd==="a"?"a":"b"));if(el)el.value="";}));
  updateMatchVisual(mid); renderStandings(); updateNextBtn(); refreshLiveTables();
}
function tennisScoreStr(m){
  if(!m.sets)return "";
  return m.sets.filter(s=>s[0]!=null||s[1]!=null).map(s=>(s[0]==null?"–":s[0])+":"+(s[1]==null?"–":s[1])).join(", ");
}
function tennisRowsHTML(m){
  ensureSets(m);
  const single=(state.tennisSets||1)===1;
  return `<div class="tennis-entry">${m.sets.map((s,i)=>`
    <div class="tset">
      ${single?"":`<span class="tlabel">Сет ${i+1}</span>`}
      <input id="tn-${m.id}-${i}-a" type="number" inputmode="numeric" min="0" max="9" placeholder="–" value="${s[0]==null?"":s[0]}" oninput="setTennisGame(${m.id},${i},'a',this.value)">
      <span class="muted">:</span>
      <input id="tn-${m.id}-${i}-b" type="number" inputmode="numeric" min="0" max="9" placeholder="–" value="${s[1]==null?"":s[1]}" oninput="setTennisGame(${m.id},${i},'b',this.value)">
    </div>`).join("")}</div>`;
}
function applyScore(mid,side,val,fromTyping){
  const m=findMatch(mid);if(!m)return;
  const v=clampScore(val);
  if(state.scoring==="fixed"){
    if(v==null){m.sa=null;m.sb=null;}
    else if(side==="a"){m.sa=v;m.sb=state.target-v;}
    else {m.sb=v;m.sa=state.target-v;}
  } else {
    if(side==="a")m.sa=v; else m.sb=v;
  }
  m.done=(m.sa!=null&&m.sb!=null);
  save();
  const setInp=(s)=>{const inp=document.getElementById("in-"+mid+"-"+s);if(inp)inp.value=(m["s"+s]==null?"":m["s"+s]);};
  setInp(side==="a"?"b":"a");                    // партнёрское поле — всегда
  if(!fromTyping || (val!=null && v!==val)) setInp(side); // активное — при степпере или если число ограничили
  updateMatchVisual(mid); renderStandings(); updateNextBtn(); refreshLiveTables();
}
function typeScore(mid,side,raw){ applyScore(mid,side, raw===""?null:parseInt(raw,10), true); }
function bumpScore(mid,side,delta){
  const m=findMatch(mid);if(!m)return;
  let cur=(side==="a"?m.sa:m.sb); if(cur==null)cur=0;
  applyScore(mid,side, cur+delta, false);
}
function clearScore(mid){
  const m=findMatch(mid);if(!m)return;
  m.sa=null;m.sb=null;m.done=false;save();
  ["a","b"].forEach(s=>{const inp=document.getElementById("in-"+mid+"-"+s);if(inp)inp.value="";});
  updateMatchVisual(mid);renderStandings();updateNextBtn();refreshLiveTables();
}

/* ---------- rendering ---------- */
function render(){
  const fmtName = isGroups() ? ("Группы"+(state.phase==="playoff"?" · плей-офф":"")) : isKing() ? "Кинг" : isKO() ? "Сетка на вылет" : isAmericano() ? "Americano" : isRR() ? "Round robin" : (isTeams()?"Команды":"Классический");
  const totalR = (isRR()||isKO()||isAmericano()) ? state.rounds.length : state.maxRounds;
  const playR = state.stage==="play" ? curRound() : null;
  const nCourts = (playR&&playR.matches&&playR.matches.length) ? Math.min(state.courts, playR.matches.length) : state.courts;
  const courtsSeg = (isKO()||isKing()||(isGroups()&&state.phase==="playoff")) ? "" : (" · " + nCourts + (nCourts===1?" корт":(nCourts<5?" корта":" кортов")));
  const fmt = fmtName + " · " + scoreLabel() + courtsSeg + (totalR?(" · "+totalR+" р."):"");
  document.getElementById("topSub").textContent =
    state.stage==="setup" ? "Настройка турнира" : state.stage==="finish" ? "Итоги турнира" : fmt;
  document.getElementById("newBtn").style.display = state.stage==="setup" ? "none" : "";
  if(state.stage==="setup"){
    document.getElementById("app").innerHTML = setupHTML();
  } else if(state.stage==="finish"){
    renderFinish();
  } else {
    renderPlay();
  }
}

function rrInfo(){
  const T=state.teams.length, C=Math.max(1,state.courts), L=Math.max(1,state.legs||1);
  if(T<2) return {teams:T, matches:0, rounds:0};
  const n=T%2?T+1:T;
  const pairsPerRound = T%2 ? (T-1)/2 : T/2;
  const circleRounds = n-1;
  const rounds = circleRounds*Math.ceil(pairsPerRound/C)*L;
  return {teams:T, matches: T*(T-1)/2*L, rounds};
}

        <button class="primary" onclick="addPlayer()">＋ Добавить</button>
      </div>
      <button class="linkbtn" onclick="toggleBulk()">${bulkOpen?"× свернуть":"≡ вставить списком"}</button>
      <div class="bulkbox" style="display:${bulkDisp}">
        <textarea id="bulkInput" rows="4" placeholder="По одному имени в строке или через запятую."></textarea>
        <button class="primary sm" style="margin-top:8px" onclick="addBulkNames()">Добавить всех</button>
      </div>
      <div class="pill-list" style="margin-top:12px">
        ${state.players.length? state.players.map((p,i)=>`
          <div class="pill">
            <div class="num">${i+1}</div>
            <input class="nameedit" type="text" value="${esc(p.name)}" oninput="editPlayerName(${p.id},this.value)">
            <button class="x" onclick="removePlayer(${p.id})" title="Удалить">✕</button>
          </div>`).join("")
          : `<div class="hint">Добавьте игроков — введите имя и нажмите Enter.</div>`}
      </div>
    </div>`;
}

function setupWarning(){
  const msgs=[];
  if(isAmericano()){
    const N=state.players.length;
    if(N>0 && N<4) msgs.push("Для Americano нужно минимум 4 игрока.");
    if(N>=4 && N%4!==0) msgs.push("Число игроков не кратно 4 — в каждом раунде пара отдыхает (по очереди). Ровнее всего на 4, 8, 12, 16.");
    const perRound=Math.floor(N/4);
    if(N>=4 && state.courts>perRound) msgs.push(`Кортов больше, чем матчей в раунде (${perRound}).`);
    if(N>=8 && perRound>state.courts) msgs.push(`Матчей в раунде (${perRound}) больше, чем кортов (${state.courts}) — играйте волнами.`);
  }else if(isGroups()){
    const T=state.teams.length, G=state.groupCount, A=state.advancePerGroup;
    if(T>0 && T<G*2) msgs.push(`Для ${G} групп нужно минимум ${G*2} команд (по 2 в группу).`);
    if(T>=G*2 && A>=Math.ceil(T/G)) msgs.push("Выходят почти все — групповой этап мало что отсеет. Возьмите топ-1 или больше команд.");
  }else if(isKing()){
    if(state.players.length>0 && state.players.length<4)msgs.push("Для Кинга нужно минимум 4 игрока.");
    if(state.players.length===4)msgs.push("С 4 игроками ротации почти нет — для Кинга лучше 5+ игроков.");
  }else if(isKO()){
    if(state.teams.length<2)msgs.push("Для сетки нужно минимум 2 команды.");
    const N=state.teams.length;
    if(N>=2 && (N&(N-1))!==0)
      msgs.push("Число команд не степень двойки (2, 4, 8, 16…) — сильнейшие по посеву получат проход в первом раунде.");
  }else if(isRR()){
    if(state.teams.length<2)msgs.push("Для круговой системы нужно минимум 2 команды.");
    const half=Math.floor(state.teams.length/2);
    if(state.teams.length>=2 && state.courts>half)
      msgs.push(`Кортов больше, чем матчей в туре (${half}). Часть кортов будет простаивать.`);
    if(state.teams.length%2!==0 && state.teams.length>=2)
      msgs.push("Нечётное число команд — в каждом туре одна команда пропускает (по очереди).");
  }else if(isTeams()){
    if(state.teams.length>0 && state.teams.length<2)msgs.push("Для турнира нужно минимум 2 команды.");
    const matchesNeed=Math.floor(state.teams.length/2);
    if(state.teams.length>=2 && state.courts>matchesNeed)
      msgs.push(`Кортов больше, чем нужно: одновременно играют ${matchesNeed} ${pluralMatch(matchesNeed)}. Лишние корты простаивают.`);
    if(state.teams.length%2!==0 && state.teams.length>=2)
      msgs.push("Нечётное число команд — каждый раунд одна команда отдыхает (по очереди).");
  }else{
    if(state.players.length%4!==0 && state.players.length>=4)
      msgs.push("Число игроков не кратно 4 — каждый раунд кто-то отдыхает (отдых распределяется по очереди).");
    const maxMatches=Math.floor(state.players.length/4);
    if(state.players.length>=4 && state.courts>maxMatches)
      msgs.push(`Кортов больше, чем нужно: одновременно играют ${maxMatches} ${pluralMatch(maxMatches)}.`);
  }
  return msgs.length? `<div class="warnbox">⚠ ${msgs.join("<br>")}</div>` : "";
}

/* ----- PLAY ----- */
function renderPlay(){
  const app=document.getElementById("app");
  if(isKO() || (isGroups() && state.phase==="playoff")){
    app.innerHTML=`<div id="curRound"></div><div id="bracket"></div>`;
    renderCurrentRound();
    renderBracket();
    return;
  }
  if(isGroups()){   // фаза групп: матчи + таблицы групп
    app.innerHTML=`
      <div class="play-grid">
        <div><div id="curRound"></div><div id="pastRounds"></div></div>
        <div class="stand"><div id="groupTables"></div></div>
      </div>`;
    renderCurrentRound();
    renderPastRounds();
    renderGroupTables();
    return;
  }
  app.innerHTML=`
    <div class="play-grid">
      <div>
        <div id="curRound"></div>
        <div id="pastRounds"></div>
      </div>
      <div class="stand">
        <div class="panel">
          <div class="round-head" style="margin-bottom:10px">
            <h2 style="margin:0">Таблица</h2>
          </div>
          <div id="standings"></div>
        </div>
      </div>
    </div>`;
  renderCurrentRound();
  renderPastRounds();
  renderStandings();
}

function renderCurrentRound(){
  const r=curRound();
  const el=document.getElementById("curRound");
  if(isKO() || (isGroups() && state.phase==="playoff")){
    const real=r.matches.filter(m=>!m.bye);
    const byeTeams=r.matches.filter(m=>m.bye).map(m=>(m.a&&m.a.length?m.a[0]:(m.b&&m.b[0])));
    const byeHTML=byeTeams.length?`<div class="byes">✅ Проходят без игры: <b>${byeTeams.map(id=>esc(unitName(id))).join(", ")}</b></div>`:"";
    const atLast=state.cur>=state.rounds.length-1;
    const tag=isGroups()?`<span class="muted" style="font-weight:700">Плей-офф · </span>`:"";
    el.innerHTML=`
      <div class="panel">
        <div class="round-head">
          <span class="badge">${koRoundName(r.matches.length)}</span>
          <span class="muted" id="roundProgress"></span>
          <div class="spacer"></div>
          <button class="ghost sm" onclick="finishTournament()" title="Подвести итоги">🏆 Завершить</button>
          <button class="primary" id="nextBtn" onclick="nextRound()">${atLast?"Чемпион 🏆 →":"Следующий раунд →"}</button>
        </div>
        <div class="courts">${real.map(m=>matchHTML(m)).join("")}</div>
        ${byeHTML}
      </div>`;
    updateNextBtn();
    real.forEach(m=>updateMatchVisual(m.id));
    return;
  }
  if(isGroups()){   // фаза групп
    const atLast=state.cur>=state.groupRoundCount-1;
    el.innerHTML=`
      <div class="panel">
        <div class="round-head">
          <span class="badge">Группы · Раунд ${r.n} / ${state.groupRoundCount}</span>
          <span class="muted" id="roundProgress"></span>
          <div class="spacer"></div>
          <button class="primary" id="nextBtn" onclick="nextRound()">${atLast?"В плей-офф →":"Следующий раунд →"}</button>
        </div>
        <div class="courts">${r.matches.map(m=>matchHTML(m)).join("")}</div>
      </div>`;
    updateNextBtn();
    r.matches.forEach(m=>updateMatchVisual(m.id));
    return;
  }
  if(isKing()){
    const m=r.matches[0];
    const kingHTML = r.kingSide ? `<div class="byes">👑 Держат корт: <b>${sideNamesInline(m.a)}</b></div>` : "";
    const queueHTML = state.kingQueue.length ? `<div class="byes">⏳ В очереди: <b>${state.kingQueue.map(id=>esc(unitName(id))).join(" → ")}</b></div>` : "";
    const atLast = state.maxRounds && r.n>=state.maxRounds;
    el.innerHTML=`
      <div class="panel">
        <div class="round-head">
          <span class="badge">Раунд ${r.n}${state.maxRounds?(" / "+state.maxRounds):""}</span>
          <span class="muted" id="roundProgress"></span>
          <div class="spacer"></div>
          <button class="ghost sm" onclick="finishTournament()" title="Подвести итоги">🏆 Завершить</button>
          <button class="primary" id="nextBtn" onclick="nextRound()">${atLast?"Итоги турнира →":"Следующий раунд →"}</button>
        </div>
        <div class="courts">${matchHTML(m)}</div>
        ${kingHTML}${queueHTML}
      </div>`;
    updateNextBtn();
    updateMatchVisual(m.id);
    return;
  }
  const wait=roundWaiting(r);
  const waitHTML = wait.length
    ? `<div class="byes">${isRR()?"⏳ Ожидают своей очереди":"😴 Отдыхают"}: <b>${wait.map(id=>esc(unitName(id))).join(", ")}</b></div>` : "";
  const total = (isRR()||isAmericano())? state.rounds.length : state.maxRounds;
  const atLast = (isRR()||isAmericano())? (state.cur>=state.rounds.length-1) : (state.maxRounds && r.n>=state.maxRounds);
  el.innerHTML=`
    <div class="panel">
      <div class="round-head">
        <span class="badge">Раунд ${r.n}${total?(" / "+total):""}</span>
        <span class="muted" id="roundProgress"></span>
        <div class="spacer"></div>
        <button class="ghost sm" onclick="finishTournament()" title="Подвести итоги">🏆 Завершить</button>
        <button class="primary" id="nextBtn" onclick="nextRound()">${atLast?"Итоги турнира →":"Следующий раунд →"}</button>
      </div>
      <div class="courts">
        ${r.matches.map(m=>matchHTML(m)).join("")}
      </div>
      ${waitHTML}
    </div>`;
  updateNextBtn();
  r.matches.forEach(m=>updateMatchVisual(m.id));
}

function matchHeadLabel(m){
  const left = m.group!=null ? ("👥 Группа "+groupLetter(m.group)) : ("🏷 "+((isKO()||isKing()||isGroups())?"Матч":"Корт")+" "+m.court);
  const right = isTennis() ? ("теннис · "+((state.tennisSets||1)>1?"2 из 3":"1 сет"))
              : state.scoring==="fixed" ? ("игра до "+state.target) : "свободный счёт";
  return `<span>${left}</span><span class="target">${right}</span>`;
}
function matchHTML(m){
  const names=(ids)=>ids.map(id=>esc(unitName(id))).join(isTeams()?" / ":"<br>");
  if(isTennis()){
    return `
    <div class="match" id="match-${m.id}">
      <div class="court">${matchHeadLabel(m)}</div>
      <div class="tn-head">
        <span class="tn-name" id="tside-${m.id}-a">${names(m.a)}</span>
        <span class="muted vs-mini">vs</span>
        <span class="tn-name right" id="tside-${m.id}-b">${names(m.b)}</span>
      </div>
      ${tennisRowsHTML(m)}
      <div class="match-foot">
        <span class="mstatus" id="status-${m.id}"></span>
        <button class="clr" onclick="clearTennis(${m.id})" title="Сбросить счёт">сброс</button>
      </div>
    </div>`;
  }
  const ctrl=(side,val)=>`
    <div class="score-ctrl">
      <button class="stp" onclick="bumpScore(${m.id},'${side}',-1)">−</button>
      <input id="in-${m.id}-${side}" type="number" inputmode="numeric" min="0" ${state.scoring==="fixed"?`max="${state.target}"`:""}
        placeholder="–" value="${val==null?"":val}" oninput="typeScore(${m.id},'${side}',this.value)">
      <button class="stp" onclick="bumpScore(${m.id},'${side}',1)">＋</button>
    </div>`;
  return `
  <div class="match" id="match-${m.id}">
    <div class="court">${matchHeadLabel(m)}</div>
    <div class="side" id="side-${m.id}-a">
      <div class="names">${names(m.a)}</div>
      ${ctrl("a",m.sa)}
    </div>
    <div class="vs-line">VS</div>
    <div class="side" id="side-${m.id}-b">
      <div class="names">${names(m.b)}</div>
      ${ctrl("b",m.sb)}
    </div>
    <div class="match-foot">
      <span class="mstatus" id="status-${m.id}"></span>
      <button class="clr" onclick="clearScore(${m.id})" title="Сбросить счёт">сброс</button>
    </div>
  </div>`;
}

function updateMatchVisual(mid){
  const m=findMatch(mid);if(!m)return;
  if(isTennis()){
    const ta=document.getElementById("tside-"+mid+"-a"), tb=document.getElementById("tside-"+mid+"-b");
    if(ta)ta.classList.toggle("win", m.done&&m.sa>m.sb);
    if(tb)tb.classList.toggle("win", m.done&&m.sb>m.sa);
    const st=document.getElementById("status-"+mid);
    if(st){
      const sc=tennisScoreStr(m);
      if(!m.done){st.textContent = sc?("идёт: "+sc):"";st.classList.remove("tie");}
      else if(m.sa===m.sb){st.textContent=(isKO()||isKing())?"⚠ Нужен победитель — измените счёт":("ничья — "+sc);st.classList.add("tie");}
      else {st.textContent="✓ "+sideNamesInline(m.sa>m.sb?m.a:m.b)+" — "+sc;st.classList.remove("tie");}
    }
    return;
  }
  const a=document.getElementById("side-"+mid+"-a");
  const b=document.getElementById("side-"+mid+"-b");
  if(a)a.classList.toggle("win", m.done&&m.sa>m.sb);
  if(b)b.classList.toggle("win", m.done&&m.sb>m.sa);
  const st=document.getElementById("status-"+mid);
  if(st){
    if(!m.done){st.textContent="";st.classList.remove("tie");}
    else if(m.sa===m.sb){st.textContent=(isKO()||isKing())?("⚠ Нужен победитель — измените счёт"):("ничья "+m.sa+":"+m.sb);st.classList.add("tie");}
    else {st.textContent="✓ "+sideNamesInline(m.sa>m.sb?m.a:m.b)+" — "+Math.max(m.sa,m.sb)+":"+Math.min(m.sa,m.sb);st.classList.remove("tie");}
  }
}

function updateNextBtn(){
  const r=curRound();
  const btn=document.getElementById("nextBtn");
  const prog=document.getElementById("roundProgress");
  if(!r)return;
  if(isKO() || (isGroups() && state.phase==="playoff")){
    const real=r.matches.filter(m=>!m.bye);
    const done=real.filter(m=>m.done&&m.sa!=null&&m.sa!==m.sb).length;
    const ties=real.some(m=>m.done&&m.sa!=null&&m.sa===m.sb);
    if(btn)btn.disabled=!koRoundDecided(r);
    if(prog)prog.textContent=ties ? "⚠ есть ничья — нужен победитель"
      : `${done}/${real.length} ${pluralMatch(real.length)} сыграно`;
    return;
  }
  if(isKing()){
    const m=r.matches[0];
    const tie=m.done&&m.sa!=null&&m.sa===m.sb;
    if(btn)btn.disabled=!kingDecided(r);
    if(prog)prog.textContent = tie ? "⚠ нужен победитель — измените счёт" : (kingDecided(r)?"матч сыгран ✓":"введите счёт матча");
    return;
  }
  const done=r.matches.filter(m=>m.done).length;
  if(btn)btn.disabled=!roundComplete(r);
  if(prog)prog.textContent=`${done}/${r.matches.length} ${pluralMatch(r.matches.length)} сыграно`;
}

function renderPastRounds(){
  const el=document.getElementById("pastRounds");
  let html="";
  // предстоящие туры — для предген-форматов (round robin, americano)
  if(isRR()||isAmericano()){
    const up=state.rounds.map((r,i)=>({r,i})).filter(x=>x.i>state.cur).map(x=>x.r);
    if(up.length){
      html += `<details class="past"><summary>📅 Дальше по расписанию (${up.length})</summary>`
        + up.map(r=>`<div class="past-match" style="border-top-style:dashed">
            <span class="muted" style="white-space:nowrap">Раунд ${r.n}</span>
            <span class="s muted" style="font-weight:600;text-align:right">${r.matches.map(m=>sideNamesInline(m.a)+" – "+sideNamesInline(m.b)).join("&nbsp; · &nbsp;")}</span>
          </div>`).join("")
        + `</details>`;
    }
  }
  // сыгранные раунды
  const past=state.rounds.map((r,i)=>({r,i})).filter(x=>x.i<state.cur).reverse().map(x=>x.r);
  past.forEach(r=>{
    const mx = state.scoring==="fixed"?` max="${state.target}"`:"";
    html += `<details class="past"><summary>Раунд ${r.n} — результаты ✎</summary>`
      + `<div class="hint" style="margin:2px 0 6px">Можно исправить счёт — таблица пересчитается.</div>`
      + r.matches.map(m=>{
          const aw=m.done&&m.sa>m.sb, bw=m.done&&m.sb>m.sa;
          if(isTennis()){
            return `<div class="past-match tn-past" id="prow-${m.id}">
              <span class="pa ${aw?"w":""}">${m.a.map(id=>esc(unitName(id))).join(" / ")}</span>
              ${tennisRowsHTML(m)}
              <span class="pb ${bw?"w":""}">${m.b.map(id=>esc(unitName(id))).join(" / ")}</span>
            </div>`;
          }
          return `<div class="past-match" id="prow-${m.id}">
            <span class="pa ${aw?"w":""}">${m.a.map(id=>esc(unitName(id))).join(" / ")}</span>
            <span class="pedit">
              <input id="pin-${m.id}-a" type="number" inputmode="numeric" min="0"${mx} placeholder="–" value="${m.sa==null?"":m.sa}" oninput="editPastScore(${m.id},'a',this.value)">
              <span class="muted">:</span>
              <input id="pin-${m.id}-b" type="number" inputmode="numeric" min="0"${mx} placeholder="–" value="${m.sb==null?"":m.sb}" oninput="editPastScore(${m.id},'b',this.value)">
            </span>
            <span class="pb ${bw?"w":""}">${m.b.map(id=>esc(unitName(id))).join(" / ")}</span>
          </div>`;
        }).join("")
      + (r.byes&&r.byes.length?`<div class="byes">😴 Отдыхали: ${r.byes.map(id=>esc(unitName(id))).join(", ")}</div>`:"")
      + `</details>`;
  });
  el.innerHTML=html;
}

function renderGroupTables(){
  const el=document.getElementById("groupTables"); if(!el)return;
  const A=state.advancePerGroup;
  el.innerHTML=state.groupTeams.map((g,gi)=>{
    const rows=groupStandings(gi);
    return `<div class="panel" style="margin-bottom:14px">
      <h2 style="margin-bottom:10px">Группа ${groupLetter(gi)}</h2>
      <table>
        <thead><tr><th>#</th><th style="text-align:left">Команда</th><th title="Сыграно">И</th><th title="Победы">В</th><th title="${isTennis()?"Выигранные геймы":"Очки"}">${isTennis()?"Геймы":"Очки"}</th><th title="Разница">±</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr class="${i<A?"lead":""}"><td><span class="rank">${i+1}</span></td><td class="name">${esc(unitName(r.id))}</td><td>${r.played}</td><td>${r.wins}</td><td class="pf">${r.pf}</td><td>${(r.pf-r.pa>0?"+":"")+(r.pf-r.pa)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="hint" style="margin-top:8px">Топ-${A} выходят в плей-офф (подсвечены).</div>
    </div>`;
  }).join("");
}
function renderBracket(){
  const el=document.getElementById("bracket"); if(!el) return;
  const res=koResults();
  const nm=(id)=> id!=null?esc(unitName(id)):"—";
  let cols="";
  state.rounds.forEach((r,rd)=>{
    if(!r.ko) return;                              // только раунды плей-офф (в формате групп пропускаем групповые)
    const matches=r.matches.map(m=>{
      if(m.bye){
        const present=(m.a&&m.a.length)?m.a[0]:((m.b&&m.b.length)?m.b[0]:null);
        return `<div class="bmatch bye${rd===state.cur?" cur":""}">
          <div class="bteam bw"><span class="bn">${nm(present)}</span><span class="bs">✓</span></div>
          <div class="bteam empty"><span class="bn"><i>авто-проход</i></span><span class="bs"></span></div>
        </div>`;
      }
      const w=koWinnerId(m);
      const aId=m.a&&m.a.length?m.a[0]:null, bId=m.b&&m.b.length?m.b[0]:null;
      const sc=(v)=>v==null?"":v;
      return `<div class="bmatch${rd===state.cur?" cur":""}">
        <div class="bteam${w!=null&&aId===w?" bw":""}"><span class="bn">${nm(aId)}</span><span class="bs">${sc(m.sa)}</span></div>
        <div class="bteam${w!=null&&bId===w?" bw":""}"><span class="bn">${nm(bId)}</span><span class="bs">${sc(m.sb)}</span></div>
      </div>`;
    }).join("");
    cols+=`<div class="bcol"><div class="bcol-title">${koRoundName(r.matches.length)}</div><div class="bcol-body">${matches}</div></div>`;
  });
  cols+=`<div class="bcol"><div class="bcol-title">Чемпион</div><div class="bcol-body">
    <div class="bmatch champ"><div class="bteam bw"><span class="bn">${res.champion!=null?("🏆 "+esc(unitName(res.champion))):"—"}</span></div></div>
  </div></div>`;
  el.innerHTML=`<div class="panel"><h2 style="margin-bottom:12px">Сетка</h2><div class="bracket-scroll"><div class="bracket">${cols}</div></div></div>`;
}

function editPastScore(mid,side,raw){
  const m=findMatch(mid);if(!m)return;
  const val = raw===""?null:parseInt(raw,10);
  const v=clampScore(val);
  if(state.scoring==="fixed"){
    if(v==null){m.sa=null;m.sb=null;}
    else if(side==="a"){m.sa=v;m.sb=state.target-v;}
    else {m.sb=v;m.sa=state.target-v;}
  }else{
    if(side==="a")m.sa=v; else m.sb=v;
  }
  m.done=(m.sa!=null&&m.sb!=null);
  save();
  const other=side==="a"?"b":"a";
  const oin=document.getElementById("pin-"+mid+"-"+other);   // партнёрское поле (в режиме суммы пересчитано)
  if(oin)oin.value=(m["s"+other]==null?"":m["s"+other]);
  if(val!=null && v!==val){const ain=document.getElementById("pin-"+mid+"-"+side);if(ain)ain.value=v;} // если ограничили число
  const row=document.getElementById("prow-"+mid);            // подсветка победителя
  if(row){
    const pa=row.querySelector(".pa"), pb=row.querySelector(".pb");
    if(pa)pa.classList.toggle("w", m.done&&m.sa>m.sb);
    if(pb)pb.classList.toggle("w", m.done&&m.sb>m.sa);
  }
  renderStandings(); refreshLiveTables();
}

function renderStandings(){
  const el=document.getElementById("standings");
  if(!el)return;
  const rows=standings();
  if(!rows.length||rows.every(r=>r.played===0&&r.byes===0)){
    el.innerHTML=`<div class="empty">Сыграйте первый матч — появится таблица.</div>`;
    return;
  }
  const copyRow = state.stage==="play"
    ? `<div class="row" style="margin-top:10px;align-items:center">
         <button class="sm ghost" onclick="copyText(resultsText())">📋 Копировать таблицу</button>
         <span id="copyMsg" class="hint"></span>
       </div>` : "";
  el.innerHTML=`
    <table>
      <thead><tr><th>#</th><th style="text-align:left">${isTeams()?"Команда":"Игрок"}</th><th title="Сыграно">И</th><th title="Победы">В</th><th title="${isTennis()?"Выигранные геймы":"Набранные очки"}">${isTennis()?"Геймы":"Очки"}</th><th title="Разница ${isTennis()?"геймов":"очков"}">±</th></tr></thead>
      <tbody>
        ${rows.map((r,i)=>`
          <tr class="${i===0?"lead":""}">
            <td><span class="rank">${i+1}</span></td>
            <td class="name">${esc(unitName(r.id))}</td>
            <td>${r.played}</td>
            <td>${r.wins}</td>
            <td class="pf">${r.pf}</td>
            <td>${(r.pf-r.pa>0?"+":"")+(r.pf-r.pa)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    <div class="hint" style="margin-top:10px">${isRR()?("Рейтинг — по победам, далее по разнице "+(isTennis()?"геймов":"очков")+"."):("Рейтинг — по сумме набранных "+(isTennis()?"геймов":"очков")+", далее по разнице.")}</div>
    ${copyRow}`;
}

function renderFinishKO(){
  const res=koResults();
  const koCanResume = !(state.cur>=state.rounds.length-1 && koRoundDecided(curRound()));
  const champBlock = res.champion!=null
    ? `<div style="text-align:center">
         <div style="font-size:2.6rem;line-height:1">🏆</div>
         <h2 style="font-size:1.5rem;margin:6px 0">Чемпион</h2>
         <div class="champ-name">${esc(unitName(res.champion))}</div>
       </div>
       <div class="podium" style="margin-top:18px">
         ${res.runnerUp!=null?`<div class="pod"><div class="medal">🥈</div><div class="pname">${esc(unitName(res.runnerUp))}</div><div class="ppts">финалист</div></div>`:""}
         ${res.semifinalists.length?`<div class="pod"><div class="medal">🥉</div><div class="pname">${res.semifinalists.map(id=>esc(unitName(id))).join("<br>")}</div><div class="ppts">полуфинал</div></div>`:""}
       </div>`
    : `<div style="text-align:center">
         <h2 style="font-size:1.4rem;margin:6px 0">Сетка не доиграна</h2>
         <div class="hint">Чемпион ещё не определён — вернитесь к сетке, чтобы доиграть.</div>
       </div>`;
  document.getElementById("app").innerHTML=`
    <div class="panel finish">
      ${champBlock}
      <div id="bracket" style="margin-top:18px"></div>
      <div class="row" style="justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap">
        <button class="primary" onclick="shareResults()">📋 Поделиться результатами</button>
        ${koCanResume?`<button class="ghost" onclick="continuePlay()">↩ Вернуться к сетке</button>`:""}
        <button class="ghost" onclick="newTournamentSameRoster()">🔁 Ещё раз (те же участники)</button>
        <button class="danger" onclick="newTournament()">↻ Новый турнир</button>
      </div>
      <div id="shareMsg" class="hint" style="text-align:center;margin-top:10px;min-height:18px"></div>
    </div>`;
  renderBracket();
}
function renderFinish(){
  if(isKO() || (isGroups() && state.phase==="playoff")){ return renderFinishKO(); }
  const rows=standings();
  const medals=isKing()?["👑","🥈","🥉"]:["🥇","🥈","🥉"];
  const top=rows.slice(0,3);
  // round robin: вернуться к расписанию, если оно ещё не доиграно (кнопка «доиграть» в RR смысла не имеет)
  const rrCanResume = isRR() && !(state.cur>=state.rounds.length-1 && roundComplete(curRound()));
  const resumeBtn = isRR()
    ? (rrCanResume?`<button class="ghost" onclick="continuePlay()">↩ Вернуться к турниру</button>`:"")
    : `<button class="ghost" onclick="continuePlay()">＋ Доиграть ещё раунд</button>`;
  document.getElementById("app").innerHTML=`
    <div class="panel finish">
      <h2 style="text-align:center;font-size:1.45rem">${isKing()?"👑 Кинг турнира":"🏆 Итоги турнира"}</h2>
      <div class="muted" style="text-align:center;margin-bottom:6px">
        ${isKing()?"Кинг":isRR()?"Round robin":(isTeams()?"Команды":"Классический")} · ${state.rounds.length} ${pluralRound(state.rounds.length)} · ${scoreLabel()}
      </div>
      <div class="podium">
        ${top.map((r,i)=>`
          <div class="pod pod${i}">
            <div class="medal">${medals[i]}</div>
            <div class="pname">${esc(unitName(r.id))}</div>
            <div class="ppts">${isRR()?(r.wins+"П · "+ptsStr(r.pf)):(ptsStr(r.pf)+" · "+r.wins+"П")}</div>
          </div>`).join("")}
      </div>
      <div id="standings"></div>
      <div class="row" style="justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap">
        <button class="primary" onclick="shareResults()">📋 Поделиться результатами</button>
        ${resumeBtn}
        <button class="ghost" onclick="newTournamentSameRoster()">🔁 Ещё раз (те же участники)</button>
        <button class="danger" onclick="newTournament()">↻ Новый турнир</button>
      </div>
      <div id="shareMsg" class="hint" style="text-align:center;margin-top:10px;min-height:18px"></div>
    </div>`;
  renderStandings();
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

render();
</script>
</body>
</html>
